      <text x="400" y="360" fill="#F0A064" font-size="22" font-weight="700"># Steam &amp; Ember</text>
      <text x="400" y="397" fill="#DF8D55" font-size="19" font-weight="700">## A quiet workspace</text>
      <text x="400" y="445" fill="#E6D7C6">Warm colors for focused work.</text>
      <text x="400" y="482" fill="#8F7C6E" font-style="italic">&gt; Calm enough to stay out of your way.</text>
      <text x="400" y="535"><tspan fill="#E58A4B">-</tspan><tspan fill="#E6D7C6"> Markdown-first styling</tspan></text>
      <text x="400" y="572"><tspan fill="#E58A4B">-</tspan><tspan fill="#E6D7C6"> Thoughtful Python syntax</tspan></text>
      <text x="400" y="609"><tspan fill="#E58A4B">-</tspan><tspan fill="#E6D7C6"> Rounded, restrained UI</tspan></text>
      <rect x="398" y="641" width="330" height="34" rx="7" fill="#2B211E"/>
      <text x="410" y="664" fill="#DBA06D">`coffee before commit`</text>
      <text x="400" y="715"><tspan fill="#C99AB9">[Espresso]</tspan><tspan fill="#E6D7C6"> after sunset.</tspan></text>

      <g fill="#6F5F55" text-anchor="end">
        <text x="922" y="360">1</text><text x="922" y="397">2</text><text x="922" y="434">3</text><text x="922" y="471">4</text><text x="922" y="508">5</text><text x="922" y="545">6</text><text x="922" y="582">7</text><text x="922" y="619">8</text><text x="922" y="656">9</text><text x="922" y="693">10</text>
      </g>
      <text x="948" y="360"><tspan fill="#E58A4B">from</tspan><tspan fill="#E6D7C6"> dataclasses </tspan><tspan fill="#E58A4B">import</tspan><tspan fill="#D1BBA8"> dataclass</tspan></text>
      <text x="948" y="397" fill="#8F7C6E" font-style="italic"># brewed for long sessions</text>
      <text x="948" y="445"><tspan fill="#D18076">@dataclass</tspan><tspan fill="#E6D7C6">(frozen=</tspan><tspan fill="#D18076">True</tspan><tspan fill="#E6D7C6">)</tspan></text>
      <text x="948" y="482"><tspan fill="#E58A4B">class</tspan><tspan fill="#C99A70"> Coffee</tspan><tspan fill="#E6D7C6">:</tspan></text>
      <text x="982" y="519"><tspan fill="#E6D7C6">name: </tspan><tspan fill="#C99A70">str</tspan></text>
      <text x="982" y="556"><tspan fill="#E6D7C6">roast: </tspan><tspan fill="#C99A70">str</tspan><tspan fill="#BDA897"> = </tspan><tspan fill="#AAB68D">"medium"</tspan></text>
      <text x="982" y="593"><tspan fill="#E6D7C6">temperature: </tspan><tspan fill="#C99A70">int</tspan><tspan fill="#BDA897"> = </tspan><tspan fill="#C99AB9">67</tspan></text>
      <text x="982" y="645"><tspan fill="#E58A4B">def</tspan><tspan fill="#DAB57E"> label</tspan><tspan fill="#E6D7C6">(self) -&gt; </tspan><tspan fill="#C99A70">str</tspan><tspan fill="#E6D7C6">:</tspan></text>
      <text x="1016" y="682"><tspan fill="#E58A4B">return</tspan><tspan fill="#AAB68D"> f"{self.name} · {self.roast}"</tspan></text>
      <text x="982" y="730"><tspan fill="#9FB2AF">print</tspan><tspan fill="#E6D7C6">(Coffee(</tspan><tspan fill="#AAB68D">"Flat White"</tspan><tspan fill="#E6D7C6">))</tspan></text>
    </g>

