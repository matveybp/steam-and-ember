        <text x="374" y="360">1</text><text x="374" y="397">2</text><text x="374" y="434">3</text><text x="374" y="471">4</text><text x="374" y="508">5</text><text x="374" y="545">6</text><text x="374" y="582">7</text><text x="374" y="619">8</text><text x="374" y="656">9</text><text x="374" y="693">10</text>
