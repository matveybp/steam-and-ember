      <text x="400" y="360" fill="#A9491B" font-size="22" font-weight="700"># Steam &amp; Ember</text>
      <text x="400" y="397" fill="#96583A" font-size="19" font-weight="700">## A quiet workspace</text>
      <text x="400" y="445" fill="#4A342B">Warm colors for focused work.</text>
      <text x="400" y="482" fill="#746154" font-style="italic">&gt; Calm enough to stay out of your way.</text>
      <text x="400" y="535"><tspan fill="#D66A25">-</tspan><tspan fill="#4A342B"> Markdown-first styling</tspan></text>
      <text x="400" y="572"><tspan fill="#D66A25">-</tspan><tspan fill="#4A342B"> Thoughtful Python syntax</tspan></text>
      <text x="400" y="609"><tspan fill="#D66A25">-</tspan><tspan fill="#4A342B"> Rounded, restrained UI</tspan></text>
      <rect x="398" y="641" width="330" height="34" rx="7" fill="#EDDFCF"/>
      <text x="410" y="664" fill="#A94718">`coffee before commit`</text>
      <text x="400" y="715"><tspan fill="#8A4B73">[Crema]</tspan><tspan fill="#4A342B"> in daylight.</tspan></text>

      <g fill="#927B6C" text-anchor="end">
        <text x="922" y="360">1</text><text x="922" y="397">2</text><text x="922" y="434">3</text><text x="922" y="471">4</text><text x="922" y="508">5</text><text x="922" y="545">6</text><text x="922" y="582">7</text><text x="922" y="619">8</text><text x="922" y="656">9</text><text x="922" y="693">10</text>
      </g>
      <text x="948" y="360"><tspan fill="#AD4711">from</tspan><tspan fill="#4A342B"> dataclasses </tspan><tspan fill="#AD4711">import</tspan><tspan fill="#735B4D"> dataclass</tspan></text>
      <text x="948" y="397" fill="#746154" font-style="italic"># brewed for long sessions</text>
      <text x="948" y="445"><tspan fill="#A94243">@dataclass</tspan><tspan fill="#4A342B">(frozen=</tspan><tspan fill="#A94243">True</tspan><tspan fill="#4A342B">)</tspan></text>
      <text x="948" y="482"><tspan fill="#AD4711">class</tspan><tspan fill="#8F5420"> Coffee</tspan><tspan fill="#4A342B">:</tspan></text>
      <text x="982" y="519"><tspan fill="#4A342B">name: </tspan><tspan fill="#8F5420">str</tspan></text>
      <text x="982" y="556"><tspan fill="#4A342B">roast: </tspan><tspan fill="#8F5420">str</tspan><tspan fill="#785F51"> = </tspan><tspan fill="#536F29">"medium"</tspan></text>
      <text x="982" y="593"><tspan fill="#4A342B">temperature: </tspan><tspan fill="#8F5420">int</tspan><tspan fill="#785F51"> = </tspan><tspan fill="#8A4B73">67</tspan></text>
      <text x="982" y="645"><tspan fill="#AD4711">def</tspan><tspan fill="#84620D"> label</tspan><tspan fill="#4A342B">(self) -&gt; </tspan><tspan fill="#8F5420">str</tspan><tspan fill="#4A342B">:</tspan></text>
      <text x="1016" y="682"><tspan fill="#AD4711">return</tspan><tspan fill="#536F29"> f"{self.name} · {self.roast}"</tspan></text>
      <text x="982" y="730"><tspan fill="#367272">print</tspan><tspan fill="#4A342B">(Coffee(</tspan><tspan fill="#536F29">"Flat White"</tspan><tspan fill="#4A342B">))</tspan></text>
    </g>

